<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Tester 1 mois gratuitement</title>
    <style>
      /* Palette et tokens alignés sur upsignon-app (lib/gui/theme) */
      :root {
        --white: #ffffff;
        --black-400: #111111;
        --gray-100: rgba(46, 56, 98, 0.1);
        --gray-200: #eaebef;
        --gray-300: #d5d7e0;
        --gray-700: #8288a1;
        --gray-800: #586081;
        --gray-900: rgba(88, 96, 129, 0.4);
        --secondary-50: #edeef5;
        --primary: #4d54d1;
        --primary-hover: #403edd;
        --teal-50: #e6fffa;
        --teal-100: #b2f5ea;
        --teal-700: #285e61;
        --red-500: #e53e3e;

        --card: var(--white);
        --text: var(--black-400);
        --text-secondary: var(--gray-800);
        --muted: var(--gray-700);
        --border: var(--gray-300);
        --error: var(--red-500);
        --primary-contrast: var(--white);

        --radius-4: 4px;
        --radius-6: 6px;
        --radius-8: 8px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: transparent;
        color: var(--text);
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      button,
      input,
      select {
        font-family: inherit;
      }

      .page {
        min-height: 0;
        padding: 20px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 1.75rem;
        line-height: 1.2;
        font-weight: 700;
      }

      .subtitle {
        margin: 0 0 20px;
        color: var(--text-secondary);
        font-size: 0.95rem;
      }

      .activity {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 18px;
      }

      .activity button {
        border: 1px solid var(--gray-900);
        background: var(--white);
        color: var(--text);
        border-radius: var(--radius-6);
        padding: 12px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          background 0.15s ease;
      }

      .activity button:hover {
        background: var(--gray-200);
      }

      .activity button.active {
        background: var(--secondary-50);
        border-color: var(--primary);
        color: var(--primary);
        font-weight: 600;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field label {
        font-size: 14px;
        color: var(--text);
        font-weight: 500;
      }

      .field input,
      .field select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: var(--radius-4);
        padding: 10px 12px;
        font-size: 14px;
        color: var(--text);
        background: var(--white);
      }

      .field input:focus,
      .field select:focus {
        outline: none;
        border-color: var(--black-400);
        box-shadow: 0 0 0 1px var(--black-400);
      }

      .field.error input,
      .field.error select {
        border-color: var(--error);
      }

      .fieldError {
        color: var(--error);
        font-size: 12px;
        line-height: 1.3;
        min-height: 16px;
      }

      .field.full {
        grid-column: 1 / -1;
      }

      .consent {
        margin-top: 16px;
        display: grid;
        gap: 10px;
      }

      .consent label {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        font-size: 13px;
        color: var(--text-secondary);
      }

      .consent label.error {
        color: var(--error);
      }

      .consent input[type='checkbox'] {
        margin-top: 2px;
        accent-color: var(--primary);
      }

      .actions {
        margin-top: 18px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .submit {
        min-height: 48px;
        border: 1px solid var(--primary);
        border-radius: var(--radius-6);
        background: var(--primary);
        color: var(--primary-contrast);
        padding: 8px 24px;
        font-weight: 600;
        cursor: pointer;
        font-size: 16px;
        line-height: 1.3;
        transition: background 120ms cubic-bezier(0.2, 0, 0, 1);
      }

      .submit:hover,
      .submit:focus {
        background: var(--primary-hover);
        border-color: var(--primary-hover);
      }

      .submit:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .status {
        font-size: 0.9rem;
        color: var(--muted);
      }

      .successPanel {
        display: none;
        margin-top: 18px;
        padding: 18px;
        border: 1px solid var(--teal-100);
        border-radius: var(--radius-8);
        background: var(--teal-50);
      }

      .successMessage {
        margin: 0;
        color: var(--teal-700);
        font-size: 1.1rem;
        font-weight: 600;
        line-height: 1.45;
      }

      .linkButton {
        margin-top: 12px;
        border: 0;
        background: transparent;
        color: var(--primary);
        font-size: 0.95rem;
        font-weight: 500;
        text-decoration: underline;
        cursor: pointer;
        padding: 0;
      }

      .linkButton:hover,
      .linkButton:focus {
        color: var(--primary-hover);
      }

      @media (max-width: 350px) {
        .card {
          padding: 10px;
        }

        .activity,
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <main class="page">
      <section class="card">
        <h1>Tester 1 mois gratuitement</h1>
        <div id="trialRequestContent">
          <p class="subtitle">Quelle est votre activité ?</p>

          <div class="activity" role="radiogroup" aria-label="Type d'activité">
            <button id="mspBtn" type="button" data-activity="msp">
              MSP, Revendeur, Infogérance
            </button>
            <button id="enterpriseBtn" type="button" data-activity="enterprise">
              Entreprise privée ou publique
            </button>
          </div>

          <form id="trialRequestForm" novalidate style="display: none">
            <input id="activityType" name="activityType" type="hidden" value="msp" />

            <div class="grid">
              <div class="field full">
                <label for="languageSelect">Langue*</label>
                <select id="languageSelect" name="language" required>
                  <option value="fr">Français</option>
                  <option value="en">English</option>
                </select>
              </div>
              <div class="field">
                <label for="firstname">Prénom*</label>
                <input id="firstname" name="firstname" required />
              </div>
              <div class="field">
                <label for="lastname">Nom*</label>
                <input id="lastname" name="lastname" required />
              </div>
              <div class="field">
                <label for="email">E-mail*</label>
                <input id="email" name="email" type="email" required />
              </div>
              <div class="field">
                <label for="phone">Numéro de téléphone*</label>
                <input id="phone" name="phone" type="tel" required />
              </div>
              <div class="field">
                <label for="company">Nom de l'entreprise*</label>
                <input id="company" name="company" required />
              </div>
              <div class="field">
                <label for="zip">Code postal*</label>
                <input id="zip" name="zip" required />
              </div>

              <div id="enterpriseFields" class="field">
                <label for="businessSector">Secteur d'activité*</label>
                <select id="businessSector" name="businessSector">
                  <option value="">Veuillez sélectionner</option>
                  <option>Industrie</option>
                  <option>Commerce / Distribution</option>
                  <option>Bâtiment / Immobilier / Travaux publics</option>
                  <option>Transport / Logistique</option>
                  <option>Arts / Médias / Communication</option>
                  <option>IT/Telecom</option>
                  <option>Secteur Public</option>
                  <option>Education</option>
                  <option>Santé</option>
                  <option>Banque et Finance</option>
                  <option>MSP Infogérance</option>
                  <option>Association</option>
                  <option>Étudiant</option>
                  <option>Particulier</option>
                </select>
              </div>

              <div id="enterpriseEmployees" class="field">
                <label for="employeeCount">Nombre de salariés</label>
                <select id="employeeCount" name="employeeCount">
                  <option value="">Veuillez sélectionner</option>
                  <option>1 à 49</option>
                  <option>50 à 99</option>
                  <option>100 à 249</option>
                  <option>250 à 499</option>
                  <option>500 à 999</option>
                  <option>1000 a 4999</option>
                  <option>5000 a 9999</option>
                  <option>10 000 et plus</option>
                </select>
              </div>
            </div>

            <div class="consent">
              <p id="marketingIntro" class="status" style="margin: 0"></p>
              <label>
                <input id="marketingConsent" name="marketingConsent" type="checkbox" />
                <span id="marketingConsentText"></span>
              </label>
              <label>
                <input id="privacyConsent" name="privacyConsent" type="checkbox" required />
                <span id="privacyConsentText"></span>
              </label>
              <div id="privacyConsentError" class="fieldError"></div>
            </div>

            <div class="actions">
              <button class="submit" id="submitButton" type="submit">Envoyer</button>
              <span id="status" class="status" aria-live="polite"></span>
            </div>
          </form>
        </div>

        <div id="successPanel" class="successPanel" aria-live="polite">
          <p id="successMessage" class="successMessage"></p>
          <button id="showFormButton" class="linkButton" type="button">
            Revenir au formulaire
          </button>
        </div>
      </section>
    </main>

    <script type="module" src="./trial-request.js"></script>
    <script
      type="text/javascript"
      id="hs-script-loader-rg"
      async
      defer
      src="%VITE_HUBSPOT_USO_MSP_TRACKING_SCRIPT_URL%"
    ></script>
    <script
      type="text/javascript"
      id="hs-script-loader-zaza"
      async
      defer
      src="%VITE_HUBSPOT_USO_DIRECT_TRACKING_SCRIPT_URL%"
    ></script>
  </body>
</html>
